name: Release Build

# Dispara quando uma tag v* é pushada (ex: v0.1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write       # pra criar/atualizar releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (3.11 — node-gyp ainda usa distutils, removido em 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish
        # --config.npmRebuild=false pula rebuild de native deps opcionais
        # (bufferutil/utf-8-validate são opcionais e usam fallback JS)
        run: npx electron-builder --win --publish=always --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
